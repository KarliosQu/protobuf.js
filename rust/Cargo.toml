[package]
name = "protobuf-rust-core"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib"]

[dependencies]
napi = { version = "2.16", features = ["napi8", "async"] }
napi-derive = "2.16"
bytes = "1.5"
thiserror = "1.0"
rustc-hash = "1.1"
once_cell = "1.19"
rayon = "1.8"
parking_lot = "0.12"

[build-dependencies]
napi-build = "2.1"
