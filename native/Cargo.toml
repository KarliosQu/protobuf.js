[package]
name = "protobufjs_native"
version = "0.1.0"
edition = "2021"
authors = ["protobuf.js contributors"]
license = "BSD-3-Clause"
description = "Rust native bindings for protobuf.js"

[lib]
crate-type = ["cdylib"]

[dependencies]
napi = { version = "3", default-features = false, features = ["napi8", "tokio_rt", "serde-json"] }
napi-derive = "3"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
once_cell = "1.19"

[build-dependencies]
napi-build = "2"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
